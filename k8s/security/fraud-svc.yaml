---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fraud-model-pvc
  namespace: minipay
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-svc
  namespace: minipay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-svc
  template:
    metadata:
      labels:
        app: fraud-svc
    spec:
      containers:
        - name: fraud-svc
          image: ghcr.io/arobertm/minipay/fraud-svc:10333c9ba2da00e291bbec15a40d1a5e2a9c5302
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: MODEL_DIR
              value: /app/model_store
          startupProbe:
            httpGet:
              path: /health
              port: 8090
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: model-store
              mountPath: /app/model_store
          resources:
            requests:
              memory: 192Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 800m
      volumes:
        - name: model-store
          persistentVolumeClaim:
            claimName: fraud-model-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: fraud-svc
  namespace: minipay
spec:
  selector:
    app: fraud-svc
  ports:
    - port: 8090
      targetPort: 8090
