---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-svc
  namespace: minipay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-svc
  template:
    metadata:
      labels:
        app: vault-svc
    spec:
      containers:
        - name: vault-svc
          image: ghcr.io/arobertm/minipay/vault-svc:10333c9ba2da00e291bbec15a40d1a5e2a9c5302
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: SERVER_PORT
              value: "8085"
            - name: MINIDS_ADDRESS
              value: http://minids-api:8301
            - name: AUTH_JWK_URI
              value: http://auth-svc:8081/oauth2/jwks-rs256
            - name: AUTH_ISSUER_URI
              value: http://auth-svc:8081
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms32m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            failureThreshold: 24
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 75m
            limits:
              memory: 320Mi
              cpu: 300m

---
apiVersion: v1
kind: Service
metadata:
  name: vault-svc
  namespace: minipay
spec:
  selector:
    app: vault-svc
  ports:
    - port: 8085
      targetPort: 8085
