---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-svc
  namespace: minipay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-svc
  template:
    metadata:
      labels:
        app: audit-svc
    spec:
      containers:
        - name: audit-svc
          image: ghcr.io/arobertm/minipay/audit-svc:10333c9ba2da00e291bbec15a40d1a5e2a9c5302
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8091
          env:
            - name: SERVER_PORT
              value: "8091"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/minipay_audit
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms32m -Xmx160m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=24m -XX:TieredStopAtLevel=1"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8091
            failureThreshold: 24
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8091
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8091
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: 96Mi
              cpu: 75m
            limits:
              memory: 384Mi
              cpu: 300m

---
apiVersion: v1
kind: Service
metadata:
  name: audit-svc
  namespace: minipay
spec:
  selector:
    app: audit-svc
  ports:
    - port: 8091
      targetPort: 8091
