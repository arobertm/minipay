---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tds-svc
  namespace: minipay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tds-svc
  template:
    metadata:
      labels:
        app: tds-svc
    spec:
      containers:
        - name: tds-svc
          image: ghcr.io/arobertm/minipay/tds-svc:da67c72c23779cbf251d10ab70ffc3fabca4e2a2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8096
          env:
            - name: SERVER_PORT
              value: "8096"
            - name: SPRING_MAIN_LAZY_INITIALIZATION
              value: "true"
            - name: TDS_BASE_URL
              value: "http://tds-svc:8096"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms32m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=24m -XX:TieredStopAtLevel=1"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8096
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8096
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8096
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 75m
            limits:
              memory: 320Mi
              cpu: 200m

---
apiVersion: v1
kind: Service
metadata:
  name: tds-svc
  namespace: minipay
spec:
  selector:
    app: tds-svc
  ports:
    - port: 8096
      targetPort: 8096
