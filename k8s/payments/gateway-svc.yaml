---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-svc
  namespace: minipay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-svc
  template:
    metadata:
      labels:
        app: gateway-svc
    spec:
      containers:
        - name: gateway-svc
          image: ghcr.io/arobertm/minipay/gateway-svc:9f78d6169f8f82d1537ea42b95f931e4b539c83b
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: SPRING_MAIN_LAZY_INITIALIZATION
              value: "true"
            - name: AUTH_JWK_URI
              value: http://auth-svc:8081/oauth2/jwks-rs256
            - name: AUTH_ISSUER_URI
              value: http://auth-svc:8081
            - name: VAULT_URL
              value: http://vault-svc:8085
            - name: FRAUD_URL
              value: http://fraud-svc:8090
            - name: NETWORK_URL
              value: http://network-svc:8086
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms32m -Xmx192m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=24m -XX:TieredStopAtLevel=1"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            failureThreshold: 24
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 384Mi
              cpu: 500m

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: minipay
spec:
  selector:
    app: gateway-svc
  ports:
    - port: 8084
      targetPort: 8084
